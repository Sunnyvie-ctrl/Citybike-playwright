# MISSION 5 — Complete this workflow; submit a PR to trigger the quality gate.
name: CityBike E2E Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # TODO: set up Node.js 22
      # TODO: install npm packages
      # TODO: install Playwright Chromium and system dependencies
      # TODO: execute tests; a failing test must fail the job
      # TODO: upload the HTML report even when tests fail

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Install playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: run Playwright E2E tests
        run: npx playwright test

      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30